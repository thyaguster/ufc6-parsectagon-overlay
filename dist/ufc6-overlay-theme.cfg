; UFC 6 Actions Overlay launcher theme. Existing files are never overwritten.
; Presets: Green, Blue, Red, Purple, Amber. Optional overrides: #RRGGBB.
; Settings > Appearance > Theme > From config follows this file (reloaded while running).
[Theme]
Preset=Green
;Accent=#76E094
;Background=#11161E
;Surface=#1D2531
;Border=#2A3544
;Text=#DAE4F0
;Muted=#B0B8C5

; First-run defaults only; saved client settings take priority.
[Appearance]
UIScale=100
FontSize=18
BoxStyle=Rounded
WindowSize=Compact
